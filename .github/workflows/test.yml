name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Running Tests
        run: |
          go mod tidy
          make test

      - name: Node software packaging and addon scripts
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v
          bash -n scripts/install-gpu-addons.sh
          bash scripts/tests/test-install-gpu-addons.sh
