# AWS Seoul Spot GPU worker. g5.xlarge provides one NVIDIA A10G GPU.
apiVersion: ml.dcn.ssu.ac.kr/v1alpha1
kind: NodeProvision
metadata:
  name: aws-g5-spot-worker-001
  namespace: default
spec:
  provider: AWS
  role: worker
  nodeLabel: gpu
  hardwareType: gpu
  region: ap-northeast-2
  instanceType: g5.xlarge
  marketType: Spot
  spotTerminationAction: Terminate
  credentialsRef:
    name: aws-node-credentials
    namespace: default
  awsConfig:
    availabilityZone: ap-northeast-2c
    rootVolumeSizeGB: 100
    tags:
      workload: gpu-training
      capacity: spot
  # The controller resolves the latest Ubuntu 22.04 AMI, a subnet in
  # ap-northeast-2c, the default security group, and an EC2 key pair.
  # Existing resources can instead be selected explicitly under awsConfig:
  #   ami: ami-0123456789abcdef0
  #   vpcId: vpc-0123456789abcdef0
  #   subnetId: subnet-0123456789abcdef0
  #   securityGroupIds:
  #     - sg-0123456789abcdef0
  #   keyPairName: my-keypair
