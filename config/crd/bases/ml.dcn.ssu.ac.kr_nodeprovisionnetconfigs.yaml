---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: nodeprovisionnetconfigs.ml.dcn.ssu.ac.kr
spec:
  group: ml.dcn.ssu.ac.kr
  names:
    kind: NodeProvisionNetConfig
    listKind: NodeProvisionNetConfigList
    plural: nodeprovisionnetconfigs
    singular: nodeprovisionnetconfig
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: NodeProvisionNetConfig is the Schema for the nodeprovisionnetconfigs
          API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of NodeProvisionNetConfig
            properties:
              clusterName:
                type: string
              softwareConfig:
                properties:
                  cnlabRuntime:
                    description: 'Deprecated: NodeProvision workers ignore this field;
                      use nodeSoftware for optional reviewed runtime.'
                    properties:
                      credentialsRef:
                        description: |-
                          CredentialsRef references a Secret with "username" and "token" keys
                          for authenticating to the OCI registry. Follows the same pattern as
                          VPNSSHCredentialsRef ??set Name to enable secret lookup.
                        properties:
                          key:
                            description: Key is the data key within the secret that
                              holds the credential.
                            type: string
                          name:
                            type: string
                          namespace:
                            type: string
                        type: object
                      orasVersion:
                        description: 'OrasVersion is the ORAS CLI version to install.
                          Default: "1.3.2"'
                        type: string
                      registry:
                        description: 'Registry is the OCI registry host. Default:
                          "ghcr.io"'
                        type: string
                      repository:
                        description: 'Repository is the image repository path. Default:
                          "vitu-mafeni/cnlab-runtime"'
                        type: string
                      version:
                        description: 'Version is the artifact version tag. Default:
                          "1.0.0-beta"'
                        type: string
                    type: object
                  imagePrepulls:
                    items:
                      description: ImagePrepull describes a single image to pre-pull
                        and which node types should pull it.
                      properties:
                        image:
                          description: Image is the fully-qualified container image
                            reference.
                          type: string
                        nodeTarget:
                          default: all
                          description: |-
                            NodeTarget controls which worker nodes pull this image.
                            "gpu"  ??GPU workers only.
                            "all"  ??every worker node (CPU and GPU).
                          enum:
                          - gpu
                          - all
                          type: string
                      required:
                      - image
                      type: object
                    type: array
                  imagePullSecretRef:
                    description: |-
                      ImagePullSecretRef optionally references a Secret containing registry
                      credentials used when pre-pulling private images listed in ImagePrepulls.
                      The Secret must have "username" and "password" keys.
                    properties:
                      key:
                        description: |-
                          Key is the data key within the secret. When omitted, the controller uses
                          well-known key names (username / password).
                        type: string
                      name:
                        type: string
                    required:
                    - name
                    type: object
                  kubernetesVersion:
                    type: string
                  nodeSoftware:
                    description: |-
                      NodeSoftware optionally configures node-level software installed before the
                      worker joins Kubernetes. When omitted, existing bootstrap behavior is
                      preserved.
                    properties:
                      gpuMode:
                        default: None
                        description: GPUMode selects optional GPU integration mode.
                        enum:
                        - None
                        - DevicePlugin
                        - DRA
                        type: string
                      migrationRuntime:
                        description: |-
                          MigrationRuntime pins the reviewed stateful-migration runtime package.
                          Required for RuntimeProfile=StatefulMigration and forbidden for Standard.
                        properties:
                          adapterSHA256:
                            pattern: ^[A-Fa-f0-9]{64}$
                            type: string
                          certifyRestore:
                            description: |-
                              CertifyRestore is an administrator opt-in for a package/environment that
                              passed GPU file-restore qualification. It is not per-Pod restore evidence.
                            type: boolean
                          crioCommit:
                            pattern: ^[A-Fa-f0-9]{40}$
                            type: string
                          criuCommit:
                            pattern: ^[A-Fa-f0-9]{40}$
                            type: string
                          packageSHA256:
                            pattern: ^[A-Fa-f0-9]{64}$
                            type: string
                          packageURL:
                            pattern: ^https://[^[:space:]'"<>?#]+$
                            type: string
                        required:
                        - adapterSHA256
                        - crioCommit
                        - criuCommit
                        - packageSHA256
                        - packageURL
                        type: object
                      nfsClient:
                        description: NFSClient installs nfs-common and verifies mount.nfs
                          is available.
                        type: boolean
                      runtimeProfile:
                        default: Standard
                        description: RuntimeProfile selects the runtime software profile.
                        enum:
                        - Standard
                        - StatefulMigration
                        type: string
                    type: object
                    x-kubernetes-validations:
                    - message: migrationRuntime is required for StatefulMigration
                        and forbidden otherwise
                      rule: 'has(self.runtimeProfile) && self.runtimeProfile == ''StatefulMigration''
                        ? has(self.migrationRuntime) : !has(self.migrationRuntime)'
                type: object
              vpnRange:
                description: foo is an example field of NodeProvisionNetConfig. Edit
                  nodeprovisionnetconfig_types.go to remove/update
                type: string
              vpnServerPublicConfig:
                properties:
                  publicIP:
                    type: string
                  sshPort:
                    type: string
                  sshUsername:
                    type: string
                  vpnPort:
                    description: VPNPort is the UDP port WireGuard listens on (default
                      51820).
                    type: string
                  vpnSshCredentialsRef:
                    properties:
                      key:
                        description: Key is the data key within the secret that holds
                          the credential.
                        type: string
                      name:
                        type: string
                      namespace:
                        type: string
                    type: object
                type: object
            type: object
          status:
            description: status defines the observed state of NodeProvisionNetConfig
            properties:
              clusterJoinCommand:
                description: ClusterJoinCommand is the kubeadm join command for worker
                  nodes.
                type: string
              joinTokenRefreshedAt:
                description: |-
                  JoinTokenRefreshedAt records when ClusterJoinCommand was last updated with
                  a fresh kubeadm bootstrap token.  The NodeProvision controller uses this to
                  ensure it never launches an EC2 instance with a token that is close to its
                  24-hour expiry.
                format: date-time
                type: string
              kubeconfig:
                description: |-
                  Kubeconfig is the base64-encoded admin kubeconfig for this cluster.
                  Populated after control-plane init and refreshed locally by the
                  kubeconfig-refresh systemd timer on the control-plane node so that
                  the remote cluster can stay self-sufficient without the management cluster.
                type: string
              usedIPAddresses:
                items:
                  type: string
                type: array
              vpnPeers:
                description: VPNPeers tracks every WireGuard peer registered on the
                  VPN server.
                items:
                  description: VPNPeerStatus records one registered WireGuard peer.
                  properties:
                    nodeName:
                      type: string
                    publicKey:
                      type: string
                    vpnIP:
                      type: string
                  type: object
                type: array
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
