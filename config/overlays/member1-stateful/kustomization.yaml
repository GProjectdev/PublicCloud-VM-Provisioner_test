apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../deploy
patches:
  - target:
      kind: Deployment
      name: remote-cluster-provisioner
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --enable-kubelet-serving-csr-approval=true
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --kubelet-serving-ca-source-kind=ConfigMap
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --kubelet-serving-ca-source-namespace=stateful-migration-system
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --kubelet-serving-ca-source-name=kubelet-serving-ca
