apiVersion: config.karmada.io/v1alpha1
kind: ResourceInterpreterCustomization
metadata:
  name: nodeprovision-status
spec:
  target:
    apiVersion: ml.dcn.ssu.ac.kr/v1alpha1
    kind: NodeProvision
  customizations:
    statusReflection:
      luaScript: >
        function ReflectStatus(observedObj)
          if observedObj == nil or observedObj.status == nil then
            return {}
          end
          return observedObj.status
        end
    statusAggregation:
      luaScript: >
        function AggregateStatus(desiredObj, statusItems)
          desiredObj.status = {}
          if statusItems == nil then
            return desiredObj
          end

          local awsCount = 0
          local selectedStatus = nil
          for i = 1, #statusItems do
            if statusItems[i].clusterName == "aws" then
              awsCount = awsCount + 1
              selectedStatus = statusItems[i].status
            end
          end
          if awsCount ~= 1 or selectedStatus == nil then
            desiredObj.status = {}
            return desiredObj
          end

          desiredObj.status = selectedStatus
          desiredObj.status.observedCluster = "aws"
          return desiredObj
        end---
apiVersion: policy.karmada.io/v1alpha1
kind: PropagationPolicy
metadata:
  name: nodeprovision-aws-only
spec:
  resourceSelectors:
    - apiVersion: ml.dcn.ssu.ac.kr/v1alpha1
      kind: NodeProvision
  placement:
    clusterAffinity:
      clusterNames:
        - aws
