apiVersion: apps/v1
kind: Deployment
metadata:
  name: remote-cluster-provisioner-controller-manager
  namespace: remote-cluster-provisioner-system
spec:
  template:
    spec:
      nodeSelector:
        workload-role: management
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
