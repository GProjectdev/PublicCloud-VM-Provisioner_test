apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../default

images:
  - name: controller
    newName: docker.io/jeongseungjun/my-publiccloudvm-provisioner
    newTag: v1.0

patches:
  - path: controller-management-node-patch.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: remote-cluster-provisioner-controller-manager
